<!-- Стили лендинга, часть 2 из 2. Блок T123.
     Все правила заперты под .gg-root — разметку Тильды не трогают. -->
<style>


/* ===========================================================================
   9-бис. ЭКОНОМИКА И УСЛОВИЯ. Тёмная секция с ценами.

   Почему тёмная и почему именно здесь: цена — единственное место, где
   посетитель останавливается и считает. Секция стоит между «Как начать» и
   «Вопросами», обе светлые; тёмная полоса между ними работает как пауза и
   не даёт цифрам утонуть в общем потоке. Внутри «Вопросов» те же условия
   пересказаны словами — здесь они собраны в цифрах, и это не дублирование:
   один блок отвечает на «сколько», другой на «а если…».

   Строение: слева две цены крупно, справа три условия списком. Никаких
   карточек и рамок — на сайте их нигде нет, всё держится на линиях.
   =========================================================================== */
.gg-root .econ__grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--s-9); align-items:start}
.gg-root .econ__prices{display:flex; flex-direction:column; gap:var(--s-7)}
.gg-root .econ__price{border-top:var(--border-w) solid var(--c-line-dark); padding-top:var(--s-5)}
.gg-root .econ__label{color:var(--c-ash)}
/* Кегль --t-num — тот же, что у номеров 01–07 в «Готовой партии»: цифры на
   странице должны быть одного роста, иначе цена спорит с нумерацией. */
.gg-root .econ__value{
  font-family:var(--f-display); font-weight:var(--fw-display);
  font-size:var(--t-num); line-height:1.05; letter-spacing:var(--ls-title);
  margin-top:var(--s-3); color:var(--c-white-warm);
}
/* Единица измерения — не часть цифры, поэтому мельче и другим цветом:
   «4 000» должно читаться первым, «₽/кг» — уточнением. */
.gg-root .econ__unit{font-size:var(--t-body); font-weight:400; letter-spacing:var(--ls-wide); color:var(--c-steel)}
.gg-root .econ__note{margin-top:var(--s-3); color:var(--c-ash)}
.gg-root .econ__terms li{
  border-top:var(--border-w) solid var(--c-line-dark);
  padding-block:var(--s-5);
}
.gg-root .econ__terms li:last-child{border-bottom:var(--border-w) solid var(--c-line-dark)}
.gg-root .econ__term{
  font-family:var(--f-display); font-weight:var(--fw-display);
  font-size:var(--t-title-s); letter-spacing:var(--ls-title);
  text-transform:uppercase; color:var(--c-white-warm);
}
.gg-root .econ__text{margin-top:var(--s-3); color:var(--c-bone)}
@media (max-width:900px){
  .gg-root .econ__grid{grid-template-columns:1fr; gap:var(--s-8)}
  /* Цены в две колонки: по одной на строку они уводят условия слишком
     далеко вниз, а рядом читаются как одна цена за услугу и тару. */
  .gg-root .econ__prices{flex-direction:row; gap:var(--grid-gap)}
  .gg-root .econ__price{flex:1 1 0}}
@media (max-width:560px){
  .gg-root .econ__prices{flex-direction:column; gap:var(--s-6)}}

/* ===========================================================================
   9. ВОПРОСЫ. Аккордеон на нативном <details>, без JS.
   =========================================================================== */
.gg-root .faq__item{border-bottom:var(--border-w) solid var(--c-line-light)}
.gg-root .faq__item:first-child{border-top:var(--border-w) solid var(--c-line-light)}
.gg-root .faq__q{
  display:flex; align-items:center; justify-content:space-between; gap:var(--s-5);
  padding-block:var(--s-5); cursor:pointer; list-style:none;
  font-family:var(--f-display); font-size:var(--t-title-s); letter-spacing:.02em; color:var(--c-graphite);
}
.gg-root .faq__q::-webkit-details-marker{display:none}
.gg-root .faq__sign{flex:none; width:14px; height:14px; position:relative}
.gg-root .faq__sign::before, .gg-root .faq__sign::after{content:""; position:absolute; background:var(--c-graphite); transition:transform var(--dur-fast) var(--ease)}
.gg-root .faq__sign::before{left:0; top:6px; width:14px; height:1px}
.gg-root .faq__sign::after{left:6px; top:0; width:1px; height:14px}
.gg-root .faq__item[open] .faq__sign::after{transform:scaleY(0)}
.gg-root .faq__a{padding-bottom:var(--s-5); max-width:70ch; color:var(--c-stone)}

/* ===========================================================================
   10. ЗАЯВКА. Тёмная секция поверх кадра первого экрана. Поля без рамок,
   только нижняя линия.
   =========================================================================== */
/* Финал возвращает кадр открытия — тот же стол, но снятый иначе. На первом
   экране рамка узкая и высокая (62% ширины, вся высота), поэтому снимок 3:4
   виден целиком: банка, жестянка, рулон этикеток. Здесь рамка во всю ширину и
   низкая, cover режет её в горизонтальную полосу, а object-position уводит
   кадр вниз — на стол, ложку и пинцет. Одна и та же съёмка, но начало
   показывает предмет, а конец — рабочее место после работы.

   Вуаль здесь самая плотная на странице: под ней лежит форма, а это самый
   мелкий текст лендинга — подписи полей, плейсхолдеры, строка согласия.

   Плотность была ещё выше (.58/.66/.90/.94/.96). При таких числах медиана
   того, что видит глаз, держалась на 12 из 255: фотография была на странице,
   весила свои килобайты, озвучивалась в alt — и не показывала ничего. Ряд
   пересчитан до .44/.54/.80/.84 вместе с гамма-подъёмом кадра и краской
   --c-ash-photo. Замер на трёх ширинах: медиана 12 → 21, девяностая
   процентиль 27 → 48, а худшая пара текст/фон при этом осталась на 7,3 : 1
   при пороге 4,5. То есть кадр стало видно, не оплатив это читаемостью.

   Опорные точки заданы в пикселях, а не в процентах. Высота секции гуляет от
   926 до 1769px, и процентная вуаль на узком экране уезжала: подводка попадала
   в открытую часть и давала 4.42:1 при пороге 4.5:1. Верхнее поле секции —
   величина постоянная (128px, на узкой ветке 82px), поэтому пиксельные точки
   держат границу «поле кончилось — текст начался» на любой высоте.

   Низ уходит в сплошной --c-abyss: сразу под секцией стоит подвал с таким же
   фоном, и любая недожатая прозрачность дала бы там видимый шов. */
.gg-root #kontakty{
  --scrim: linear-gradient(180deg,
    rgba(var(--c-abyss-rgb), .44) 0,
    rgba(var(--c-abyss-rgb), .54) 100px,
    rgba(var(--c-abyss-rgb), .80) 200px,
    rgba(var(--c-abyss-rgb), .84) 320px,
    rgba(var(--c-abyss-rgb), .84) 70%,
    rgba(var(--c-abyss-rgb), 1)   100%);
}
.gg-root #kontakty .bg-media > img{object-position:50% 82%}

/* Левая колонка короче формы примерно на 297px — контакты обрывались высоко,
   а под ними висела пустота. Колонка растянута на высоту формы, а блок
   контактов прижат к её низу: нижние края обеих колонок совпадают. */
.gg-root .cta__grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:var(--s-9); align-items:stretch}
.gg-root .cta__aside{display:flex; flex-direction:column}
.gg-root .cta__aside .cta__contacts{margin-top:auto; padding-top:var(--s-8)}
.gg-root .cta h2{font-family:var(--f-display); font-weight:var(--fw-display); font-size:var(--t-display-m); line-height:1.02; text-transform:uppercase}
.gg-root .cta__lead{margin-top:var(--s-5); max-width:34ch; color:var(--c-ash)}
.gg-root .cta__contacts{margin-top:var(--s-8); display:flex; flex-direction:column; gap:var(--s-5); color:var(--c-ash)}
.gg-root .cta__contacts a:hover{color:var(--c-bone)}
/* Подписи «Руководитель подразделения», «Адрес» и т.д. стояли цветом
   --c-stone. Токен описан как «вторичный текст на светлом», а здесь фон
   тёмный: замер по композиции фото + вуаль дал 3,30–3,41 : 1 при пороге 4,5
   (кегль 13px). Это был единственный живой провал контраста, оставшийся на
   странице после Фазы 1. Взят --c-ash — 7,78 : 1. */
.gg-root .cta__contacts dt{color:var(--c-ash)}
.gg-root .cta__contacts dd{margin:var(--s-1) 0 0; color:var(--c-ash)}
/* Шесть полей в две колонки. Вертикальный шаг формы — 48px, и складывается он
   из двух слагаемых: строчный gap сетки (24) плюс нижний отступ самого поля
   (24). Внутри сетки это работает, а вот под ней — нет: у последней строки
   остаётся только отступ поля, и перед одиночным полем «Задача» получалось
   24 вместо 48. Свой margin-bottom у ряда добирает недостающие 24 и на
   промежутки внутри сетки не влияет — он приложен к её внешнему краю. */
.gg-root .form__row{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:var(--s-5) var(--grid-gap); margin-bottom:var(--s-5)}
.gg-root .field{display:flex; flex-direction:column; gap:var(--s-2); margin-bottom:var(--s-5)}
.gg-root .field label{font-size:var(--t-micro); letter-spacing:var(--ls-wide); text-transform:uppercase; color:var(--c-ash)}
.gg-root .field input, .gg-root .field select, .gg-root .field textarea{
  background:transparent; border:0; border-bottom:var(--border-w) solid var(--c-line-dark);
  border-radius:var(--radius); color:var(--c-bone); font-family:var(--f-display);
  font-size:var(--t-body); padding:var(--s-3) 0; width:100%;
  /* Межстрочный интервал задан числом намеренно. При line-height:normal
     браузер считает высоту строки по метрикам конкретного элемента, и <select>
     получался на 2px выше <input>: в ряду «Продукт | Объём партии» две
     подчёркивающие линейки стояли на разной высоте — 909 и 907. Два пикселя
     не читаются как ошибка, но линейка тонкая и разнобой виден. */
  line-height:1.45;
  transition:border-color var(--dur-fast) var(--ease);
}
.gg-root .field textarea{resize:vertical; min-height:84px; line-height:1.6}
.gg-root .field select{cursor:pointer}
.gg-root .field select option{background:var(--c-carbon); color:var(--c-bone)}
.gg-root .field input:focus, .gg-root .field select:focus, .gg-root .field textarea:focus{outline:none; border-bottom-color:var(--c-steel)}
/* Плейсхолдеры. Было rgba(168,162,154,.55) — на «абиссе» это давало цвет
   rgb(97,94,90) и контраст 3,06 : 1 при пороге 4,5. Единственное место на
   сайте, где замер показал прямой провал. Взят непрозрачный --c-ash: 7,78 : 1.
   После осветления палитры 10.09.2026 ссылка переставлена на --c-hint —
   это ровно то же значение, но вынесенное в отдельный токен: --c-ash ушёл
   почти в белый, и подсказка сравнялась бы с введённым значением. */
.gg-root .field input::placeholder, .gg-root .field textarea::placeholder{color:var(--c-hint); opacity:1}
/* Согласие. Формулировка и ссылки — как на gurman.guru. */
.gg-root .form__consent{display:flex; gap:var(--s-3); align-items:flex-start; margin:var(--s-5) 0 var(--s-6); color:var(--c-ash); font-size:var(--t-micro); line-height:1.7}
.gg-root .form__consent input{accent-color:var(--c-steel); margin-top:4px; flex:none}
.gg-root .form__consent a{color:var(--c-bone); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px}
.gg-root .form__consent a:hover{color:var(--c-steel)}
.gg-root .form__status{margin-top:var(--s-5); color:var(--c-steel); min-height:1.5em}

/* ===========================================================================
   11. КАРТА. Врезка между «Контактами» и подвалом — по прямому указанию
   заказчика. Единственное место, где страница обращается в сеть за чем-то,
   кроме шрифтов: живая Яндекс-карта работает только из iframe с их сервера.
   Оговорка записана в README. Кадр обесцвечен фильтром — цветная карта
   спорила бы с палитрой референса; лёгкое затемнение прижимает её к чёрному
   соседству. Без сети остаются адрес строкой и внешняя ссылка над картой.
   =========================================================================== */
.gg-root .map{background:var(--c-abyss); border-top:var(--border-w) solid var(--c-line-dark)}
.gg-root .map__head{
  display:flex; flex-wrap:wrap; align-items:baseline;
  gap:var(--s-3) var(--s-7); padding-block:var(--s-6);
}
.gg-root .map__label{color:var(--c-ash); margin:0}
.gg-root .map__addr{color:var(--c-bone); margin:0}
.gg-root .map__link{
  margin-left:auto; color:var(--c-ash);
  text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px;
}
.gg-root .map__link:hover{color:var(--c-bone)}
.gg-root .map__frame{position:relative; height:var(--map-h); border-top:var(--border-w) solid var(--c-line-dark)}
.gg-root .map__frame iframe{
  position:absolute; inset:0; width:100%; height:100%; border:0; display:block;
  filter:grayscale(1) brightness(.92) contrast(1.02);
}

/* ===========================================================================
   ПОДВАЛ. Логотип, разделы, реквизиты, юридические ссылки.
   =========================================================================== */
.gg-root .site-footer{background:var(--c-abyss); border-top:var(--border-w) solid var(--c-line-dark); padding-block:var(--s-8)}
.gg-root .site-footer__grid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:var(--grid-gap); align-items:start}
.gg-root .site-footer .logo img{height:44px}
.gg-root .site-footer .micro{color:var(--c-ash)}
.gg-root .site-footer a:hover{color:var(--c-bone)}
/* Заголовки колонок и строка «Контрактная фасовка…» — жирным по указанию
   заказчика (2026-09-07). На референсе подвал ровный по весу, это осознанное
   отступление. 700 — специально догруженное начертание Golos Text.
   Цвет не задаётся: у всех трёх заголовков в разметке есть класс micro, и
   правило .site-footer .micro (два класса против одного) всё равно перебивало
   стоявший здесь --c-stone. Объявление было мёртвым и при этом сбивало с
   толку — на тёмном фоне --c-stone дал бы 3,3 : 1. */
.gg-root .site-footer__col-title{font-weight:700}
.gg-root .site-footer__tagline{font-weight:700; margin-top:var(--s-5)}
.gg-root .site-footer__list{margin-top:var(--s-4); display:flex; flex-direction:column; gap:var(--s-3)}
/* Нижняя строка стояла на четырёхколоночной сетке колонок выше, но «Согласие
   на обработку персональных данных» — 41 знак с трекингом — в
   свою колонку (~300px) не входило и ломалось на две строки, пока соседи
   стояли в одну. По указанию заказчика ряд собран заново: кегль на ступень
   ниже (--t-micro-s) у всех четырёх пунктов сразу — одинаково ровно, — каждый
   пункт цельный (white-space наследуется), при нехватке ширины переносится
   пункт целиком, а не слово. На 1440 все четыре стоят в один ряд. */
.gg-root .site-footer__bottom{
  margin-top:var(--s-8); padding-top:var(--s-5);
  border-top:var(--border-w) solid var(--c-line-dark);
  display:flex; flex-wrap:wrap; justify-content:space-between;
  gap:var(--s-3) var(--grid-gap);
  font-size:var(--t-micro-s); letter-spacing:var(--ls-legal); white-space:nowrap;
  /* Цвет здесь тоже не задаётся — по той же причине, что и у заголовков
     колонок: на самом ряду висит класс micro, ряд всегда был --c-ash. */
}
/* Обёртка двух ссылок распущена до самих ссылок: каждая — отдельный пункт
   ряда и переносится независимо. */
.gg-root .site-footer__legal{display:contents}
.gg-root .site-footer__legal a{color:var(--c-ash); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px}
.gg-root .site-footer__legal a:hover{color:var(--c-bone)}

/* ===========================================================================
   COOKIE-БАННЕР. Требование из «Приложения» к согласию: показать при первом
   визите, до срабатывания необязательных счётчиков.

   Почему полосой внизу, а не карточкой в углу и не окном по центру:
   модальное окно перекрыло бы первый экран — тот самый кадр, ради которого
   сайт и сделан; карточка в углу на 360px закрывает четверть экрана. Полоса
   во всю ширину отнимает только нижние ~120px и совпадает с логикой самого
   сайта, где всё выстроено полными горизонтальными лентами.

   Фон непрозрачный --c-carbon, а не полупрозрачный: под баннером
   прокручиваются и светлые, и тёмные секции, и на светлой подложке текст
   --c-bone поплыл бы. --c-bone на --c-carbon — 11,4 : 1.
   =========================================================================== */
.gg-root .cookie{
  position:fixed; inset:auto 0 0 0; z-index:60;
  background:var(--c-carbon);
  border-top:var(--border-w) solid var(--c-line-dark);
  padding-block:var(--s-5);
  /* Появление снизу — движение того же порядка, что и .reveal по сайту.
     transform, а не height: не вызывает пересчёт раскладки страницы. */
  transform:translateY(100%); opacity:0; visibility:hidden;
  transition:transform var(--dur-slow) var(--ease), opacity var(--dur-slow) var(--ease), visibility 0s linear var(--dur-slow);
}
.gg-root .cookie.is-open{transform:none; opacity:1; visibility:visible; transition-delay:0s}
.gg-root .cookie__inner{
  display:flex; flex-wrap:wrap; align-items:center;
  justify-content:space-between; gap:var(--s-4) var(--s-7);
}
/* Класс micro тут намеренно не используется, хотя кегль взят его же:
   micro переводит текст в прописные, а здесь 250 знаков сплошного юридического
   текста — капслоком его никто не дочитает. Строчные и обычный трекинг.
   flex:1 1 34ch — текст забирает свободную середину ленты, но не тянется
   бесконечно: верхняя граница 92 знака, дальше строка теряется при переносе. */
.gg-root .cookie__text{
  flex:1 1 34ch; max-width:92ch; margin:0;
  color:var(--c-bone);
  font-size:var(--t-micro); line-height:1.7;
}
.gg-root .cookie__text a{color:var(--c-bone); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px}
.gg-root .cookie__text a:hover{color:var(--c-steel)}
.gg-root .cookie__actions{display:flex; flex-wrap:wrap; gap:var(--s-3); flex:none}
@media (max-width:760px){
  /* На телефоне текст и кнопки встают друг под друга, кнопки — в один ряд
     на всю ширину: тянуться большим пальцем к краю экрана не нужно. */
  .gg-root .cookie__inner{flex-direction:column; align-items:stretch; justify-content:flex-start}
  /* Сброс flex обязателен: в колонке flex-basis считается по высоте, и
     34ch превращались в ~440px высоты абзаца — баннер занимал пол-экрана,
     а между текстом и кнопками зияла пустая полоса. */
  .gg-root .cookie__text{flex:0 0 auto; max-width:none}
  .gg-root .cookie__actions .btn{flex:1 1 0; justify-content:center}}

/* ===========================================================================
   АДАПТИВ. Контрольные ширины: 1440 / 768 / 360.
   =========================================================================== */
